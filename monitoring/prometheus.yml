global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'goftyar-gateway'
    static_configs:
      - targets: ['gateway:8000']

  - job_name: 'goftyar-auth-service'
    static_configs:
      - targets: ['auth-service:8001']

  - job_name: 'goftyar-widget-service'
    static_configs:
      - targets: ['widget-service:8002']

  - job_name: 'goftyar-chat-service'
    static_configs:
      - targets: ['chat-service:8003']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
