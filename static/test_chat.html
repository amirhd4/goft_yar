<!DOCTYPE html>
<html lang="fa" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <title>آزمایش گفت یار</title>
    </head>
    <body style="font-family: sans-serif; padding: 20px">
        <h2>آزمایش چت بلادرنگ</h2>
        <div>
            <label for="token"></label><input id="token" type="text" placeholder="توکن JWT کاربر" style="width: 300px;">
            <button onClick="connectWS()">اتصال به چت</button>
        </div>
        <br>
        <div>
            <label for="receiver_id"></label><input id="receiver_id" type="number" placeholder="شناسه دریافت کننده">
            <label for="message"></label><input id="message" type="text" placeholder="متن پیام">
            <button onClick="sendMessage()">ارسال</button>
        </div>
        <h3>
            پیام ها:
        </h3>
        <ul id="messages"></ul>

        <script>
            let ws;
            function connectWS() {
                const token = document.getElementById("token").value;
                ws = new WebSocket(`ws://localhost:8000/ws/chat?token=${token}`);

                ws.onopen = () => alert("به وب سوکت متصل شدید!")
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    const li = document.createElement("li");
                    li.textContent = `از ${data.sender_username} (آیدی ${data.sender_id}): ${data.content}`;
                    document.getElementById("messages").appendChild(li);
                }
                ws.onclose = () => alert("اتصال قطع شد.")
            }

            function sendMessage() {
                const receiver_id = document.getElementById("receiver_id").value;
                const content = document.getElementById("message").value;
                ws.send(JSON.stringify({ receiver_id, content }))
                document.getElementById("receiver_id").value = "";
            }
        </script>
    </body>
</html>
