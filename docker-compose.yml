services:
  postgres:
    image: postgres:15-alpine
    container_name: goftyar-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: goftyar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: goftyar-redis
    ports:
      - "6379:6379"
    restart: always

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: goftyar-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: always

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: goftyar-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    restart: always

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goftyar-auth-service
    command: uvicorn app.services.auth_service:app --host 0.0.0.0 --port 8001
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/goftyar
    depends_on:
      - postgres
    restart: always

  widget-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goftyar-widget-service
    command: uvicorn app.services.widget_service:app --host 0.0.0.0 --port 8002
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/goftyar
    depends_on:
      - postgres
    restart: always

  chat-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goftyar-chat-service
    command: uvicorn app.services.chat_service:app --host 0.0.0.0 --port 8003
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/goftyar
      - PUBSUB_ADAPTER=${PUBSUB_ADAPTER:-redis}
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - postgres
      - redis
      - kafka
    volumes:
      - uploads_data:/workspace/uploads
    restart: always

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goftyar-gateway
    command: uvicorn app.services.gateway:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - WIDGET_SERVICE_URL=http://widget-service:8002
      - CHAT_SERVICE_URL=http://chat-service:8003
    depends_on:
      - auth-service
      - widget-service
      - chat-service
    volumes:
      - uploads_data:/workspace/uploads
    restart: always

  frontend:
    build:
      context: ./goftyar-client
      dockerfile: Dockerfile
    container_name: goftyar-frontend
    ports:
      - "80:80"
    depends_on:
      - gateway
    restart: always

volumes:
  pgdata:
  uploads_data:
